# MeatPi Docs: user manuals for MeatPi products.
# Local preview: see README.md (python -m mkdocs serve).
site_name: MeatPi Docs
site_description: User manuals and setup guides for MeatPi products
site_url: https://meatpihq.github.io/meatpi-docs/
repo_url: https://github.com/meatpiHQ/meatpi-docs
repo_name: meatpiHQ/meatpi-docs
edit_uri: edit/main/docs/
copyright: Copyright &copy; MeatPi

theme:
  name: material
  custom_dir: overrides
  language: en
  # the WiCAN PRO web interface logo (overrides/.icons/meatpi/logo.svg), inlined so
  # the wordmark takes the header's text colour
  icon:
    logo: meatpi/logo
    repo: fontawesome/brands/github
  favicon: assets/favicon.ico
  # system fonts, like the device's web interface: no Google Fonts request
  font: false
  # navigation.tabs makes the left sidebar show only the active product's
  # chapters; the tab bar itself is replaced by the product drop-down
  # (overrides/main.html, overrides/partials/product-picker.html)
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

# the chapters WiCAN OBD and WiCAN USB share are written once under
# docs/shared/wican/ and included from each product's pages with a snippet
# (see the writing guide); they are not pages of their own
exclude_docs: |
  shared/**/*.md

extra:
  # the entries of the product drop-down in the sidebar: top-level nav
  # sections by title, in this order
  products:
    - WiCAN PRO
    - WiCAN OBD
    - WiCAN USB
    - ESPNetLink
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/meatpiHQ
    - icon: fontawesome/solid/store
      link: https://www.meatpi.com

plugins:
  - search
  # click a screenshot to enlarge it
  - glightbox:
      touchNavigation: true
      effect: zoom
      zoomable: true
      skip_classes:
        - no-lightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - pymdownx.keys
  # ==text== renders as a label from the device's web interface (see the writing guide)
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

