<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The OBD-II plug of WiCAN PRO seen from the front, with the signal on each of its sixteen pins</title>
  <rect width="720" height="392" rx="12" fill="#ffffff"/>
  <!-- the plug: a trapezoid with rounded corners, wider at the top, pins toward you -->
  <path d="M46.3 75.3 A30 30 0 0 1 75.9 40.0 L644.1 40.0 A30 30 0 0 1 673.7 75.3 L638.4 271.3 A30 30 0 0 1 608.9 296.0 L111.1 296.0 A30 30 0 0 1 81.6 271.3 Z" fill="#2b3340" stroke="#1a2029" stroke-width="3"/>
  <path d="M68.4 85.7 A20 20 0 0 1 88.1 62.0 L631.9 62.0 A20 20 0 0 1 651.6 85.7 L619.1 259.7 A20 20 0 0 1 599.4 276.0 L120.6 276.0 A20 20 0 0 1 100.9 259.7 Z" fill="#3a4454"/>
  <!-- the key slot between the rows -->
  <rect x="215" y="162" width="290" height="12" rx="6" fill="#1a2029"/>
  <!-- top row, pins 8 to 1 from left to right, signal names below the pins -->
  <g text-anchor="middle">
    <rect x="108" y="96" width="24" height="14" rx="2" fill="#7c8797"/><text x="120" y="88" font-size="14" font-weight="700" fill="#9aa7b6">8</text>
    <rect x="176" y="96" width="24" height="14" rx="2" fill="#4ec0e8"/><text x="188" y="88" font-size="14" font-weight="700" fill="#4ec0e8">7</text>
    <text x="188" y="130" font-size="12" font-weight="700" fill="#e7eef6">ISO-K</text>
    <rect x="244" y="96" width="24" height="14" rx="2" fill="#f2b705"/><text x="256" y="88" font-size="14" font-weight="700" fill="#f2b705">6</text>
    <text x="256" y="130" font-size="12" font-weight="700" fill="#e7eef6">HS</text>
    <text x="256" y="145" font-size="12" font-weight="700" fill="#e7eef6">CANH</text>
    <rect x="312" y="96" width="24" height="14" rx="2" fill="#dce2ea"/><text x="324" y="88" font-size="14" font-weight="700" fill="#dce2ea">5</text>
    <text x="324" y="130" font-size="12" font-weight="700" fill="#e7eef6">GND</text>
    <rect x="380" y="96" width="24" height="14" rx="2" fill="#dce2ea"/><text x="392" y="88" font-size="14" font-weight="700" fill="#dce2ea">4</text>
    <text x="392" y="130" font-size="12" font-weight="700" fill="#e7eef6">GND</text>
    <rect x="448" y="96" width="24" height="14" rx="2" fill="#ff9d5c"/><text x="460" y="88" font-size="14" font-weight="700" fill="#ff9d5c">3</text>
    <text x="460" y="130" font-size="12" font-weight="700" fill="#e7eef6">MS</text>
    <text x="460" y="145" font-size="12" font-weight="700" fill="#e7eef6">CANH</text>
    <rect x="516" y="96" width="24" height="14" rx="2" fill="#ff7eb6"/><text x="528" y="88" font-size="14" font-weight="700" fill="#ff7eb6">2</text>
    <text x="528" y="130" font-size="12" font-weight="700" fill="#e7eef6">J1850+</text>
    <rect x="584" y="96" width="24" height="14" rx="2" fill="#37d98a"/><text x="596" y="88" font-size="14" font-weight="700" fill="#37d98a">1</text>
    <text x="596" y="130" font-size="12" font-weight="700" fill="#e7eef6">SW CAN</text>
  </g>
  <!-- bottom row, pins 16 to 9 from left to right, signal names above the pins -->
  <g text-anchor="middle">
    <rect x="108" y="224" width="24" height="14" rx="2" fill="#f2686b"/><text x="120" y="258" font-size="14" font-weight="700" fill="#f2686b">16</text>
    <text x="120" y="212" font-size="12" font-weight="700" fill="#e7eef6">V+</text>
    <rect x="176" y="224" width="24" height="14" rx="2" fill="#4ec0e8"/><text x="188" y="258" font-size="14" font-weight="700" fill="#4ec0e8">15</text>
    <text x="188" y="212" font-size="12" font-weight="700" fill="#e7eef6">ISO-L</text>
    <rect x="244" y="224" width="24" height="14" rx="2" fill="#f2b705"/><text x="256" y="258" font-size="14" font-weight="700" fill="#f2b705">14</text>
    <text x="256" y="197" font-size="12" font-weight="700" fill="#e7eef6">HS</text>
    <text x="256" y="212" font-size="12" font-weight="700" fill="#e7eef6">CANL</text>
    <rect x="312" y="224" width="24" height="14" rx="2" fill="#c39bff"/><text x="324" y="258" font-size="14" font-weight="700" fill="#c39bff">13</text>
    <text x="324" y="197" font-size="12" font-weight="700" fill="#e7eef6">CH</text>
    <text x="324" y="212" font-size="12" font-weight="700" fill="#e7eef6">CANL</text>
    <rect x="380" y="224" width="24" height="14" rx="2" fill="#c39bff"/><text x="392" y="258" font-size="14" font-weight="700" fill="#c39bff">12</text>
    <text x="392" y="197" font-size="12" font-weight="700" fill="#e7eef6">CH</text>
    <text x="392" y="212" font-size="12" font-weight="700" fill="#e7eef6">CANH</text>
    <rect x="448" y="224" width="24" height="14" rx="2" fill="#ff9d5c"/><text x="460" y="258" font-size="14" font-weight="700" fill="#ff9d5c">11</text>
    <text x="460" y="197" font-size="12" font-weight="700" fill="#e7eef6">MS</text>
    <text x="460" y="212" font-size="12" font-weight="700" fill="#e7eef6">CANL</text>
    <rect x="516" y="224" width="24" height="14" rx="2" fill="#ff7eb6"/><text x="528" y="258" font-size="14" font-weight="700" fill="#ff7eb6">10</text>
    <text x="528" y="212" font-size="12" font-weight="700" fill="#e7eef6">J1850-</text>
    <rect x="584" y="224" width="24" height="14" rx="2" fill="#7c8797"/><text x="596" y="258" font-size="14" font-weight="700" fill="#9aa7b6">9</text>
  </g>
  <text x="360" y="322" font-size="13" fill="#586472" text-anchor="middle">The plug seen from the front, pins toward you. Pin 1 is at the top right, the socket in the car is the mirror image.</text>
  <!-- legend -->
  <g font-size="13" fill="#2b3340">
    <rect x="40" y="341" width="18" height="14" rx="3" fill="#f2686b"/><text x="68" y="352">16 battery (V+)</text>
    <rect x="180" y="341" width="18" height="14" rx="3" fill="#dce2ea"/><text x="208" y="352">4, 5 ground</text>
    <rect x="305" y="341" width="18" height="14" rx="3" fill="#f2b705"/><text x="333" y="352">6, 14 HS CAN</text>
    <rect x="435" y="341" width="18" height="14" rx="3" fill="#ff9d5c"/><text x="463" y="352">3, 11 MS CAN</text>
    <rect x="570" y="341" width="18" height="14" rx="3" fill="#c39bff"/><text x="598" y="352">12, 13 CH CAN</text>
    <rect x="40" y="369" width="18" height="14" rx="3" fill="#37d98a"/><text x="68" y="380">1 SW CAN</text>
    <rect x="180" y="369" width="18" height="14" rx="3" fill="#ff7eb6"/><text x="208" y="380">2, 10 J1850</text>
    <rect x="305" y="369" width="18" height="14" rx="3" fill="#4ec0e8"/><text x="333" y="380">7, 15 K and L line</text>
    <rect x="435" y="369" width="18" height="14" rx="3" fill="#7c8797"/><text x="463" y="380">8, 9 not used</text>
  </g>
</svg>
