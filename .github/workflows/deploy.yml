# Build the manuals with MkDocs Material and publish them to GitHub Pages.
# Pages must be set to "GitHub Actions" as the source (repo Settings > Pages).
name: Deploy docs
on:
  workflow_dispatch:
  push:
    branches:
      - main
  # the firmware repository's "Build Vehicle Profiles" workflow sends this after a profile merge
  repository_dispatch:
    types: [vehicle-profiles]
  # a daily rebuild as the fallback, so the Supported vehicles page never trails the profiles by more than a day
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the Supported vehicles page comes from the profile sources on wican-fw main (sparse clone, two folders)
      - run: python tools/supported_vehicles.py --clone
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
